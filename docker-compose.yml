---
services:
  umami:
    image: ghcr.io/umami-software/umami:latest
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://umami:***@db:5432/umami
      APP_SECRET: replace-me-with-a-random-string
    depends_on:
      db:
        condition: service_healthy
    init: true
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "curl http://localhost:3000/api/heartbeat"]
      interval: 5s
      timeout: 5s
      retries: 5
  db:
    build:
      context: .
      dockerfile: db/Dockerfile
    image: umami-db-pg18:latest
    environment:
      POSTGRES_DB: umami
      POSTGRES_USER: umami
      POSTGRES_PASSWORD: umami
    volumes:
      - umami-db-data:/var/lib/postgresql/data
      - ./db/postgresql/init-extensions.sql:/docker-entrypoint-initdb.d/01-extensions.sql
      - ./db/postgresql/init-hypertables.sql:/docker-entrypoint-initdb.d/02-hypertables.sql
      - ./db/postgresql/init-age.sql:/docker-entrypoint-initdb.d/03-age.sql
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-umami} -d ${POSTGRES_DB:-umami}"]
      interval: 5s
      timeout: 5s
      retries: 5
volumes:
  umami-db-data:
