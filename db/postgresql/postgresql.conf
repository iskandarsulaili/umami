# PostgreSQL 18 Configuration for Umami with TimescaleDB + AGE
# Performance optimized for analytics workloads

shared_preload_libraries = 'timescaledb,age'

# Memory
shared_buffers = '256MB'
work_mem = '16MB'
maintenance_work_mem = '64MB'
effective_cache_size = '1GB'

# Analytics query performance
random_page_cost = 1.1
effective_io_concurrency = 200
parallel_query_workers = 4
max_parallel_workers_per_gather = 4
max_parallel_workers = 8

# Write-ahead log
wal_buffers = '16MB'
max_wal_size = '2GB'
min_wal_size = '1GB'

# Query planning
geqo = on
from_collapse_limit = 12
join_collapse_limit = 12

# Stats
track_activities = on
track_counts = on
track_io_timing = on
track_functions = 'all'

# AGE
search_path = '"$user", public, ag_catalog'

# TimescaleDB
timescaledb.telemetry_level = 'off'
