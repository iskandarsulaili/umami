[build-system]
requires = ["setuptools>=64.0"]
build-backend = "setuptools.build_meta"

[project]
name = "umami-ml"
version = "1.0.0"
description = "GPU-accelerated ML service for Umami analytics"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.0.0",
    "xgboost>=2.0.0",
    "scikit-learn>=1.3.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.0.0",
    "psycopg2-binary>=2.9.0",
    "onnxruntime>=1.17.0",
]

[tool.setuptools.packages.find]
include = ["ml*"]
